<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shu Badna Notlob - شو بدنا نطلب</title>
  <style>
    :root {
      --primary-teal: #0f4c5c;
      --bg-light: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #141414;
      --border-color: #eee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-color);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
      position: relative;
      padding-bottom: 30px;
    }

    /* Header Styling */
    header {
      background: #fff;
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary-teal);
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--primary-teal);
      display: none;
    }

    .back-btn.visible {
      display: block;
    }

    /* Views Framework */
    .view-page {
      display: none;
      padding: 15px;
    }

    .view-page.active {
      display: block;
    }

    /* Home Hero */
    .hero-banner {
      background: linear-gradient(135deg, #0f4c5c, #e5989b);
      color: white;
      padding: 30px 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-btn {
      background: white;
      color: var(--primary-teal);
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    /* Search Bar */
    .search-input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    /* Category & Restaurant Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .cat-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .cat-info {
      padding: 8px;
    }

    .cat-title-ar {
      font-weight: bold;
      font-size: 14px;
    }

    .cat-title-en {
      font-size: 11px;
      color: #666;
    }

    /* Restaurant Card */
    .restaurant-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .rest-top-content {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .rest-icon {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      object-fit: cover;
    }

    .rest-actions {
      display: flex;
      gap: 5px;
    }

    .action-btn {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
    }

    .btn-menu { background: #0f4c5c; }
    .btn-contact { background: #25D366; }
    .btn-location { background: #ea4335; }

    /* Admin Form Styling */
    .admin-section {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .admin-btn {
      width: 100%;
      background: var(--primary-teal);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- HEADER -->
    <header>
      <div class="header-right">
        <button id="backBtn" class="back-btn" onclick="goBack()">&#8594;</button>
        <div id="defaultLogoSection" style="display:flex; align-items:center; gap:8px;">
          <img src="assets/logo.png" alt="Logo" class="logo-img" onclick="checkAdminAccess()" onerror="this.src='https://via.placeholder.com/35'">
          <span id="headerTitleText" class="header-title">Shu Badna Notlob</span>
        </div>
        <div id="categoriesHeaderSection" style="display:none; align-items:center;">
          <span class="header-title">الأقسام المتاحة</span>
        </div>
      </div>
    </header>

    <!-- 1. HOME VIEW -->
    <div id="pageHome" class="view-page active">
      <div class="hero-banner">
        <h2>جوعان ومحتار؟</h2>
        <p>اكتشف أفضل المطاعم والأقسام المتاحة بكل سهولة</p>
        <button class="hero-btn" onclick="openCategories()">تصفح الأقسام</button>
      </div>
    </div>

    <!-- 2. CATEGORIES VIEW -->
    <div id="pageCategories" class="view-page">
      <input type="text" id="categoriesSearchInput" class="search-input" placeholder="ابحث عن قسم..." onkeyup="filterCategories()">
      <div id="categoriesGridContainer" class="grid-container"></div>
    </div>

    <!-- 3. RESTAURANTS VIEW -->
    <div id="pageRestaurants" class="view-page">
      <div style="text-align:center; margin-bottom:15px;">
        <img id="categoryHeroImg" src="" style="width:100%; height:120px; object-fit:cover; border-radius:8px;" onerror="this.style.display='none'">
        <h3 id="categoryHeroTitle" style="margin-top:8px; color:var(--primary-teal);"></h3>
      </div>
      <input type="text" id="restaurantsSearchInput" class="search-input" placeholder="ابحث عن مطعم..." onkeyup="filterRestaurants()">
      <div id="restaurantsListContainer"></div>
    </div>

    <!-- 4. RESTAURANT PROFILE VIEW -->
    <div id="pageRestProfile" class="view-page">
      <div style="text-align:center; margin-bottom:15px;">
        <img id="profileLogo" src="" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
        <h2 id="profileName" style="margin-top:5px;"></h2>
        <p id="profileDesc" style="color:#666; font-size:13px;"></p>
      </div>
      
      <div class="rest-actions" style="margin-bottom:20px;">
        <a id="profileMenuBtn" href="#" target="_blank" class="action-btn btn-menu">MENU</a>
        <a id="profileContactBtn" href="#" target="_blank" class="action-btn btn-contact">CONTACT</a>
        <a id="profileLocationBtn" href="#" target="_blank" class="action-btn btn-location">LOCATION</a>
      </div>

      <h4 style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">معرض الصور</h4>
      <div id="profileGalleryContainer" class="grid-container"></div>
    </div>

    <!-- 5. LOGIN VIEW -->
    <div id="pageLogin" class="view-page">
      <div class="admin-section" style="margin-top:40px;">
        <h3 style="text-align:center; margin-bottom:15px;">تسجيل دخول الإدارة</h3>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="******">
        </div>
        <button class="admin-btn" onclick="performAdminLogin()">دخول</button>
      </div>
    </div>

    <!-- 6. ADMIN VIEW -->
    <div id="pageAdmin" class="view-page">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>لوحة التحكم</h3>
        <button onclick="logoutAdmin()" style="background:#d32f2f; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">تسجيل الخروج</button>
      </div>

      <!-- قسم إضافة/تعديل قسم -->
      <div class="admin-section">
        <h4 id="categoryFormTitle" style="margin-bottom:10px;">إضافة / تعديل قسم</h4>
        <input type="hidden" id="editCatDocId">
        <div class="form-group">
          <label>الاسم (بالعربي)</label>
          <input type="text" id="adminCatAr">
        </div>
        <div class="form-group">
          <label>الاسم (بالإنجليزي)</label>
          <input type="text" id="adminCatEn">
        </div>
        <div class="form-group">
          <label>رابط الصورة</label>
          <input type="text" id="adminCatImg">
        </div>
        <div style="display:flex; gap:5px;">
          <button class="admin-btn" onclick="saveCategoryToFirebase()">حفظ القسم</button>
          <button class="admin-btn" onclick="resetCategoryForm()" style="background:#666;">إلغاء</button>
        </div>
      </div>

      <!-- قائمة الأقسام الحالية (تظهر بها المنسدلة للترقيم #1, #2...) -->
      <h4 style="margin-bottom:8px;">إدارة الأقسام والترتيب:</h4>
      <div id="adminManageCategoriesContainer" style="margin-bottom:25px;"></div>

      <!-- قسم إضافة/تعديل مطعم -->
      <div class="admin-section">
        <h4 id="formTitle" style="margin-bottom:10px;">إضافة مطعم جديد</h4>
        <input type="hidden" id="editDocId">
        <div class="form-group">
          <label>القسم</label>
          <select id="adminCategory"></select>
        </div>
        <div class="form-group">
          <label>اسم المطعم</label>
          <input type="text" id="adminName">
        </div>
        <div class="form-group">
          <label>الوصف</label>
          <input type="text" id="adminDesc">
        </div>
        <div class="form-group">
          <label>رابط اللوجو</label>
          <input type="text" id="adminLogo">
        </div>
        <div class="form-group">
          <label>روابط معرض الصور (مفصولة بفاصلة)</label>
          <input type="text" id="adminGallery">
        </div>
        <div class="form-group">
          <label>رقم الواتساب</label>
          <input type="text" id="adminPhone">
        </div>
        <div class="form-group">
          <label>رابط المنيو</label>
          <input type="text" id="adminMenu">
        </div>
        <div class="form-group">
          <label>رابط الخريطة</label>
          <input type="text" id="adminMap">
        </div>
        <div style="display:flex; gap:5px;">
          <button class="admin-btn" onclick="saveRestaurantToFirebase()">حفظ المطعم</button>
          <button class="admin-btn" onclick="resetAdminForm()" style="background:#666;">إلغاء</button>
        </div>
      </div>

      <!-- قائمة المطاعم الحالية -->
      <h4 style="margin-bottom:8px;">إدارة المطاعم:</h4>
      <div id="adminManageListContainer"></div>
    </div>

  </div>

  <!-- ربط ملف JavaScript -->
  <script type="module" src="script.js"></script>
</body>
</html>
